{% extends 'base.html' %}

{% block title %}Log In - SocialConnect{% endblock %}

{% block content %}
<div class="form-card">
    <div style="text-align: center; margin-bottom: 24px;">
        <h1 style="font-size: 2rem; font-weight: 800; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">SocialConnect</h1>
        <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px;">Log in to see photos from your friends.</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" required placeholder="Enter username">
        </div>

        <div class="form-group">
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required placeholder="Enter password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;">Log In</button>
    </form>

    <div class="form-footer">
        Don't have an account? <a href="{% url 'register' %}">Sign up</a>
    </div>
</div>
{% endblock %}
