{% extends 'base.html' %}

{% block title %}Create Community Space{% endblock %}

{% block content %}
<div style="max-width: 650px; margin: 0 auto; background: var(--sanctuary-card); border: 1px solid var(--sanctuary-border); border-radius: var(--radius-lg); padding: 28px;">
    <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 6px;">Create a Community Space</h1>
    <p style="color: var(--sanctuary-text-muted); font-size: 0.9rem; margin-bottom: 24px;">
        Build a private or public digital sanctuary for your college batch, coding circle, company club, or friends.
    </p>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div style="margin-bottom: 18px;">
            <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px;">Space Name *</label>
            <input type="text" name="name" required placeholder="e.g. Stanford CS 2026, Indie Film Club" style="width: 100%; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--sanctuary-border); background: var(--sanctuary-surface); color: var(--sanctuary-text); outline: none;">
        </div>

        <div style="margin-bottom: 18px;">
            <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px;">Description</label>
            <textarea name="description" rows="3" placeholder="What is this space about?" style="width: 100%; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--sanctuary-border); background: var(--sanctuary-surface); color: var(--sanctuary-text); outline: none;"></textarea>
        </div>

        <div style="margin-bottom: 18px;">
            <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px;">Rules Charter & Community Values</label>
            <textarea name="rules" rows="4" placeholder="e.g. 1. Respect fellow members. 2. Verify announcements before sharing. 3. Safe space for honest questions." style="width: 100%; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--sanctuary-border); background: var(--sanctuary-surface); color: var(--sanctuary-text); outline: none;"></textarea>
        </div>

        <div style="margin-bottom: 18px;">
            <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px;">Privacy Access Model</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <label style="border: 1px solid var(--sanctuary-border); padding: 14px; border-radius: var(--radius-md); background: var(--sanctuary-surface); cursor: pointer; display: flex; align-items: flex-start; gap: 10px;">
                    <input type="radio" name="privacy" value="PUBLIC" checked style="margin-top: 3px;">
                    <div>
                        <div style="font-weight: 700; font-size: 0.9rem;"><i class="fa-solid fa-globe"></i> Public Space</div>
                        <div style="font-size: 0.8rem; color: var(--sanctuary-text-muted); margin-top: 2px;">Anyone can view and join freely.</div>
                    </div>
                </label>
                <label style="border: 1px solid var(--sanctuary-border); padding: 14px; border-radius: var(--radius-md); background: var(--sanctuary-surface); cursor: pointer; display: flex; align-items: flex-start; gap: 10px;">
                    <input type="radio" name="privacy" value="PRIVATE" style="margin-top: 3px;">
                    <div>
                        <div style="font-weight: 700; font-size: 0.9rem;"><i class="fa-solid fa-lock"></i> Private Sanctuary</div>
                        <div style="font-size: 0.8rem; color: var(--sanctuary-text-muted); margin-top: 2px;">Requires admin approval to join. Walled from outsiders.</div>
                    </div>
                </label>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px;">
            <div>
                <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px;">Space Avatar</label>
                <input type="file" name="avatar" accept="image/*" style="font-size: 0.85rem; color: var(--sanctuary-text-muted);">
            </div>
            <div>
                <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px;">Cover Banner</label>
                <input type="file" name="banner" accept="image/*" style="font-size: 0.85rem; color: var(--sanctuary-text-muted);">
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px;">
            <a href="{% url 'communities:explore' %}" style="padding: 10px 18px; border-radius: var(--radius-md); background: var(--sanctuary-surface); color: var(--sanctuary-text); text-decoration: none; border: 1px solid var(--sanctuary-border);">Cancel</a>
            <button type="submit" style="padding: 10px 24px; border-radius: var(--radius-md); background: var(--sanctuary-accent); color: #fff; border: none; font-weight: 700; cursor: pointer;">
                Launch Space
            </button>
        </div>
    </form>
</div>
{% endblock %}
